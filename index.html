<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const params = new URLSearchParams(location.search);
  if (params.has('embed')) document.body.classList.add('embed');
  const COLORS = ['#c2410c', '#1d4ed8', '#15803d', '#7c3aed'];
  const LS_KEY = 'ifpages-toy-v0';
  const store = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); // {pageId: {forecasts:{csqId:{b:p}}, added:[...]}}
  const save = () => localStorage.setItem(LS_KEY, JSON.stringify(store));
  const mine = (pid) => (store[pid] ||= {forecasts: {}, added: []});

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = (p) => p == null ? '–' : Math.round(p * 100) + '%';
  const median = (xs) => { const s = [...xs].sort((a,b)=>a-b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };

  let current = DATA.pages.find(p => p.id === (params.get('page') || location.hash.slice(1))) || DATA.pages[0];
  let sortBy = 'delta';

  function allConsequences(page) {
    const added = mine(page.id).added.map(c => ({...c, status: 'accepted', proposedBy: 'you', local: true}));
    return [...page.consequences, ...added];
  }
  function estimatesWithYou(page, c) {
    const est = {...(c.estimates || {})};
    const y = mine(page.id).forecasts[c.id];
    if (y) est.you = y;
    return est;
  }
  function aggregate(page, c) {
    const est = c.estimates || {};          // aggregate = median of listed contributors (not "you")
    const out = {};
    for (const b of page.parent.branches) {
      const xs = Object.values(est).map(e => e[b.id]).filter(v => v != null);
      out[b.id] = xs.length ? median(xs) : null;
    }
    if (c.local) Object.assign(out, c.p);
    return out;
  }
  const pParent = (page) => page.parent.sources[0].p;
  function branchProbs(page) {
    const p = pParent(page);
    if (typeof p === 'object') return p;              // several outcomes: {branchId: p}
    const [b0, b1] = page.parent.branches;           // binary: p is P(first branch)
    return {[b0.id]: p, [b1.id]: 1 - p};
  }
  function delta(page, agg) {
    const vs = page.parent.branches.map(b => agg[b.id]).filter(v => v != null);
    return vs.length < 2 ? null : Math.max(...vs) - Math.min(...vs);
  }
  function implied(page, agg) {
    const bp = branchProbs(page); let s = 0;
    for (const b of page.parent.branches) { if (agg[b.id] == null) return null; s += bp[b.id] * agg[b.id]; }
    return s;
  }

  function chart(page, agg, you) {
    const W = 250, H = 46, x0 = 10, x1 = W - 10, X = p => x0 + p * (x1 - x0);
    const bs = page.parent.branches;
    const vals = bs.map(b => agg[b.id]).filter(v => v != null);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Probability under each branch">`;
    s += `<line x1="${x0}" x2="${x1}" y1="20" y2="20" stroke="#e3e6ee" stroke-width="2"/>`;
    for (const t of [0, .5, 1]) s += `<line x1="${X(t)}" x2="${X(t)}" y1="15" y2="25" stroke="#cfd4de"/><text x="${X(t)}" y="40" font-size="9" text-anchor="middle" fill="#8a93a5">${t*100}%</text>`;
    if (vals.length >= 2) s += `<line x1="${X(Math.min(...vals))}" x2="${X(Math.max(...vals))}" y1="20" y2="20" stroke="#9aa3b5" stroke-width="3"/>`;
    bs.forEach((b, i) => { const v = agg[b.id]; if (v != null) s += `<circle cx="${X(v)}" cy="20" r="6" fill="${COLORS[i]}"><title>${esc(b.label)}: ${pct(v)}</title></circle>`; });
    if (you) bs.forEach((b, i) => { const v = you[b.id]; if (v != null) s += `<circle cx="${X(v)}" cy="20" r="8" fill="none" stroke="${COLORS[i]}" stroke-width="1.5" stroke-dasharray="2 2"><title>You, ${esc(b.label)}: ${pct(v)}</title></circle>`; });
    return s + '</svg>';
  }

  const pill = (who) => {
    if (who === 'you') return '<span class="pill you">you (local)</span>';
    const c = DATA.contributors[who] || {kind: 'human', label: who};
    return `<span class="pill ${c.kind}">${c.kind === 'ai' ? 'AI · ' : 'human · '}${esc(c.label)}</span>`;
  };

  function renderTabs() {
    const nav = document.getElementById('tabs');
    nav.innerHTML = DATA.pages.map(p => `<button role="tab" aria-selected="${p === current}" data-id="${p.id}">${esc(p.short)}</button>`).join('');
    nav.onclick = (e) => { const id = e.target.dataset?.id; if (!id) return; current = DATA.pages.find(p => p.id === id); history.replaceState(null, '', '#' + id); render(); };
  }

  function renderConsequence(page, c) {
    const agg = aggregate(page, c);
    const you = mine(page.id).forecasts[c.id];
    const d = delta(page, agg), imp = implied(page, agg);
    const resolved = page.status === 'resolved' && c.outcome != null;
    const outcomePill = resolved ? (c.outcome ? '<span class="pill ok">happened</span>' : '<span class="pill bad">did not happen</span>') : '';
    const statusPill = c.status === 'candidate' ? '<span class="pill na">candidate · awaiting human review</span>'
                     : c.status === 'rejected' ? '<span class="pill na">rejected</span>' : '';
    const ests = estimatesWithYou(page, c);
    const estRows = Object.entries(ests).map(([who, e]) =>
      `<tr><td>${pill(who)}</td>${page.parent.branches.map(b => `<td>${pct(e[b.id])}</td>`).join('')}</tr>`).join('');
    const canForecast = c.status === 'accepted' && page.status !== 'resolved';
    const sliders = canForecast ? `<div class="yours" id="y-${esc(c.id)}">
        ${page.parent.branches.map((b, i) => { const v = you?.[b.id] ?? agg[b.id] ?? .5; return `
          <label><span class="dot" style="background:${COLORS[i]}"></span>${esc(b.label)}
            <input type="range" min="0" max="100" value="${Math.round(v*100)}" data-c="${esc(c.id)}" data-b="${b.id}">
            <output>${pct(v)}</output></label>`; }).join('')}
        <div class="small muted">Saved in your browser only.</div></div>` : '';
    return `<div class="card csq ${c.status}">
      <div>
        <div class="title">${esc(c.title)}</div>
        <div class="small">${pill(c.proposedBy)} ${statusPill} ${outcomePill} <span class="muted">· horizon ${esc(c.horizon)}</span></div>
        <div class="id">${esc(c.id)}</div>
        ${c.status === 'rejected' ? `<div class="small muted">Reason: ${esc(c.rejectReason)}</div>` : ''}
      </div>
      <div class="chart">
        ${c.status === 'accepted' ? chart(page, agg, you) + `<div class="nums">Δ ${d == null ? '–' : pct(d)} · implied P(Y) ${pct(imp)}</div>` : '<div class="nums">not forecast yet</div>'}
        ${canForecast ? `<div class="nums"><button class="btn" data-toggle="${esc(c.id)}">${you ? 'edit my forecast' : 'add my forecast'}</button></div>` : ''}
      </div>
      ${sliders}
      <details><summary>criterion, mechanism, forecasts</summary>
        <p><b>Resolves YES if:</b> ${esc(c.criterion)}<br><b>Mechanism (one line):</b> ${esc(c.mechanism)}${c.evidence ? `<br><b>What happened:</b> ${esc(c.evidence)}` : ''}</p>
        ${estRows ? `<table><tr><th>Forecaster</th>${page.parent.branches.map(b => `<th>if ${esc(b.label)}</th>`).join('')}</tr>${estRows}</table>` : ''}
        <p class="muted small">Stable ID → this consequence could later become the parent of its own page.</p>
      </details>
    </div>`;
  }

  function scoring(page) {
    const rb = page.resolvedBranch, rlabel = page.parent.branches.find(b => b.id === rb).label;
    const other = page.parent.branches.filter(b => b.id !== rb).map(b => b.label).join(', ');
    const scored = page.consequences.filter(c => c.outcome != null);
    const by = {};
    for (const c of scored) for (const [who, e] of Object.entries(c.estimates || {})) {
      if (e[rb] == null) continue;
      (by[who] ||= []).push((e[rb] - (c.outcome ? 1 : 0)) ** 2);
    }
    const aggB = scored.map(c => (aggregate(page, c)[rb] - (c.outcome ? 1 : 0)) ** 2);
    const rows = Object.entries(by).map(([who, xs]) => `<tr><td>${pill(who)}</td><td>${xs.length}</td><td>${(xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(3)}</td></tr>`).join('');
    return `<h3>Resolution and scoring</h3>
      <div class="card">
        <p style="margin-top:0">Parent resolved: <b>${esc(rlabel)}</b>. The <b>${esc(other)}</b> branch never happened, so forecasts on it are <span class="pill na">annulled</span>: they can't be checked directly. This is one of the open problems.</p>
        <table><tr><th>Forecaster</th><th>scored consequences</th><th>mean Brier on realised branch (lower is better)</th></tr>
          ${rows}
          <tr><td><span class="pill">page aggregate (median)</span></td><td>${aggB.length}</td><td>${(aggB.reduce((a,b)=>a+b,0)/aggB.length).toFixed(3)}</td></tr>
        </table>
        <p class="small muted">Brier scores the probabilities given to the consequences that were <i>listed</i>. It says nothing about what nobody listed: see below.</p>
      </div>
      <h3>Missed consequences <span class="muted small">(identified after the fact, e.g. by blind raters)</span></h3>
      <div class="card">
        <ul style="margin:.2rem 0">${(page.missed || []).map(m => `<li><b>${esc(m.title)}</b> <span class="muted small">${esc(m.note)}</span></li>`).join('')}</ul>
        <p class="small muted" style="margin-bottom:0">Listed and happened: ${scored.filter(c => c.outcome).length}. Important but missed: ${(page.missed || []).length}.
        How to weigh “important” and turn this into a coverage score is the main research question, not solved here.</p>
      </div>`;
  }

  function addForm(page) {
    if (page.status === 'resolved') return '';
    return `<h3>Propose a consequence</h3>
      <form class="card add" id="add">
        <input name="title" required placeholder="Consequence, e.g. 'NYC public schools closed for ≥3 days because of a storm'">
        <input name="criterion" required placeholder="Resolves YES if…">
        <input name="horizon" required placeholder="Horizon (YYYY-MM-DD)" pattern="\\d{4}-\\d{2}-\\d{2}">
        <input name="mechanism" placeholder="Mechanism in one line (optional)">
        ${page.parent.branches.map(b => `<label class="small">P(consequence | ${esc(b.label)}) in % <input name="p_${b.id}" type="number" min="0" max="100" required></label>`).join('')}
        <div><button class="btn" type="submit">Add (local only)</button> <button class="btn" type="button" id="export">Export my contributions (JSON)</button> <button class="btn" type="button" id="reset">Reset mine</button></div>
      </form>`;
  }

  function render() {
    renderTabs();
    const page = current, P = page.parent;
    const bp = branchProbs(page);
    let cs = allConsequences(page);
    const key = {
      delta: c => -(delta(page, aggregate(page, c)) ?? -1),
      first: c => -(aggregate(page, c)[P.branches[0].id] ?? -1),
      implied: c => -(implied(page, aggregate(page, c)) ?? -1),
    }[sortBy];
    const order = {accepted: 0, candidate: 1, rejected: 2};
    cs = cs.sort((a, b) => (order[a.status] - order[b.status]) || (key(a) - key(b)));

    document.getElementById('page').innerHTML = `
      <section class="card parent">
        <div class="small muted">${page.status === 'resolved' ? `Resolved page · written as of ${esc(page.asIfWrittenOn)}` : 'Open page'} · <span class="id">${esc(page.id)}</span></div>
        <h2>If: ${esc(P.title)}</h2>
        <div class="meta">
          ${P.sources.map(s => `<span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.platform)}</a>: ${typeof s.p === 'object' ? P.branches.map(b => esc(b.label) + ' ' + pct(s.p[b.id])).join(' · ') : pct(s.p)} <span class="small">(${esc(s.asOf)}${s.note ? ', ' + esc(s.note) : ''})</span></span>`).join('')}
          <span>closes ${esc(P.closes)}</span>
        </div>
        <div class="small" style="margin-top:.4rem"><b>Resolution:</b> ${esc(P.resolution)}</div>
        <div class="branches">${P.branches.map((b, i) => `<span class="pill"><span class="dot" style="background:${COLORS[i]}"></span>${esc(b.label)} · ${pct(bp[b.id])}</span>`).join('')}</div>
      </section>
      <div class="card warn">
        <b>Read me.</b> Numbers are <b>conditional probabilities, not causal effects</b>: “P(Y | X)” is not “X causes Y”.
        All forecasts on this toy page are <b>illustrative</b> (demo contributors), not anyone's considered view. ${esc(page.note || '')}
      </div>
      <div class="toolbar">
        <span>${cs.filter(c => c.status === 'accepted').length} consequences</span>
        <label>Sort by <select id="sort">
          <option value="delta" ${sortBy==='delta'?'selected':''}>difference between branches (Δ)</option>
          <option value="first" ${sortBy==='first'?'selected':''}>P(Y | ${esc(P.branches[0].label)})</option>
          <option value="implied" ${sortBy==='implied'?'selected':''}>implied unconditional P(Y)</option>
        </select></label>
        <span class="small muted">${P.branches.map((b, i) => `<span class="dot" style="background:${COLORS[i]}"></span>if ${esc(b.label)}`).join(' &nbsp; ')} &nbsp; ◌ yours</span>
      </div>
      ${cs.map(c => renderConsequence(page, c)).join('')}
      ${page.status === 'resolved' ? scoring(page) : ''}
      ${addForm(page)}
      <details class="hide-embed" style="margin-top:1.2rem"><summary class="muted">Data model (JSON) for this page</summary><pre>${esc(JSON.stringify(page, null, 2))}</pre></details>
      <p class="small muted hide-embed">Δ = gap between the highest and lowest branch probability; a consequence only belongs on the page if Δ is meaningfully above zero.
      Implied P(Y) = Σ P(branch) × P(Y | branch), using the first platform's probability. It can be checked against standalone questions on Y, where they exist.</p>`;

    document.getElementById('sort').onchange = (e) => { sortBy = e.target.value; render(); };
    document.querySelectorAll('[data-toggle]').forEach(btn => btn.onclick = () =>
      document.getElementById('y-' + btn.dataset.toggle).classList.toggle('open'));
    document.querySelectorAll('.yours input[type=range]').forEach(r => {
      r.oninput = () => { r.nextElementSibling.textContent = r.value + '%'; };
      r.onchange = () => {
        const f = mine(page.id).forecasts;
        const cur = f[r.dataset.c] ||= {};
        // initialise all branches from the sliders so a forecast is always complete
        document.querySelectorAll(`.yours input[data-c="${CSS.escape(r.dataset.c)}"]`).forEach(s => cur[s.dataset.b] = +s.value / 100);
        save(); render();
        document.getElementById('y-' + r.dataset.c)?.classList.add('open');
      };
    });
    const form = document.getElementById('add');
    if (form) {
      form.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(form), p = {};
        for (const b of P.branches) p[b.id] = Math.min(100, Math.max(0, +fd.get('p_' + b.id))) / 100;
        const slug = String(fd.get('title')).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
        const id = 'csq:local/' + slug + '-' + Date.now().toString(36);
        mine(page.id).added.push({id, title: fd.get('title'), criterion: fd.get('criterion'), horizon: fd.get('horizon'),
          mechanism: fd.get('mechanism') || '–', p, estimates: {}});
        mine(page.id).forecasts[id] = p;
        save(); render();
      };
      document.getElementById('export').onclick = () => {
        const blob = new Blob([JSON.stringify({page: page.id, exported: new Date().toISOString(), ...mine(page.id)}, null, 2)], {type: 'application/json'});
        const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: page.id.replace(/[^a-z0-9]+/gi, '_') + '_mine.json'});
        a.click(); URL.revokeObjectURL(a.href);
      };
      document.getElementById('reset').onclick = () => { if (confirm('Delete your local forecasts and consequences for this page?')) { delete store[page.id]; save(); render(); } };
    }
  }

  render();
})();
</script>
</body>
</html>
